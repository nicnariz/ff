services:
  postgres:
    image: postgres:16-alpine
    container_name: familia-feliz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: familia_feliz
      POSTGRES_USER: familia_feliz
      POSTGRES_PASSWORD: familia_feliz
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U familia_feliz -d familia_feliz']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
